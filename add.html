<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Recipe - Krave Kitchen</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2C4F4F">

  <!-- Google icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!-- Materialize CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav>
    <div class="nav-wrapper teal">
      <a href="index.html" class="brand-logo">Krave Kitchen</a>
      <ul id="nav-mobile" class="right hide-on-med-and-down">
        <li><a href="recipes.html">Recipes</a></li>
        <li><a href="add.html">Add Recipe</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </div>
  </nav>

  <!-- Add Recipe Form -->
  <div class="container" style="margin-top: 30px;">
    <h4>Add a New Recipe</h4>

    <form id="add-recipe-form">
      <div class="input-field">
        <input id="recipe-name" type="text" required>
        <label for="recipe-name">Recipe Name</label>
      </div>

      <div class="input-field">
        <textarea id="recipe-ingredients" class="materialize-textarea" required></textarea>
        <label for="recipe-ingredients">Ingredients (comma separated)</label>
      </div>

      <div class="input-field">
        <textarea id="recipe-instructions" class="materialize-textarea" required></textarea>
        <label for="recipe-instructions">Instructions (line separated)</label>
      </div>

      <button class="btn teal" type="submit">Add Recipe</button>
    </form>
  </div>

  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>


  <script type="module">
    import { db, collection, addDoc } from './firebase.js';
    import { addRecipeOffline } from './indexedDB.js';

    const form = document.getElementById('add-recipe-form');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const recipe = {
        title: document.getElementById('recipe-name').value,
        ingredients: document.getElementById('recipe-ingredients').value.split(','),
        instructions: document.getElementById('recipe-instructions').value.split('\n'),
        img: ''
      };

      if (navigator.onLine) {
        try {
          await addDoc(collection(db, 'recipes'), recipe);
          alert('Recipe saved online!');
        } catch (err) {
          console.error(err);
          alert('Failed to save online. Saving offline.');
          await addRecipeOffline(recipe);
        }
      } else {
        await addRecipeOffline(recipe);
        alert('Offline! Recipe saved locally and will sync when online.');
      }

      form.reset();
    });
  </script>

  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(reg => console.log('Service Worker registered!', reg))
          .catch(err => console.log('Service Worker failed:', err));
      });
    }
  </script>

</body>
</html>
